[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barbados-traffic-mlops"
version = "0.1.0"
description = "MLOps project for traffic video analytics: YOLO-based detections, feature engineering, training, and production pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "ultralytics>=8.4.14",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pyrefly>=0.52.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_mlops"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu",  marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
